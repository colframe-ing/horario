<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071D49">
  <title>COLFRAME — Hoja de vida</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .mod-nav { background:#fff; border-bottom:1px solid var(--cf-gray-mid); padding:0 16px; display:flex; gap:4px; overflow-x:auto; }
    .mod-nav-link { padding:10px 14px; font-size:0.82rem; font-weight:700; color:var(--cf-gray-text); text-decoration:none; border-bottom:3px solid transparent; white-space:nowrap; display:inline-block; }
    .mod-nav-link.active { color:var(--cf-blue); border-bottom-color:var(--cf-blue); }
    .mod-nav-link:hover:not(.active) { color:var(--cf-dark); }
    .mod-nav-sep { width:1px; background:var(--cf-gray-mid); margin:8px 6px; flex-shrink:0; }

    .hv-head { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px; }
    .hv-cb { font-size:0.75rem; font-weight:800; color:var(--cf-gray-text); letter-spacing:0.06em; }
    .hv-title { font-size:1.25rem; font-weight:800; color:var(--cf-dark); line-height:1.3; margin:2px 0 6px; }
    .hv-sub { font-size:0.8rem; color:var(--cf-gray-text); }
    .hv-estado { display:inline-block; font-size:0.72rem; font-weight:800; padding:3px 10px; border-radius:999px; margin-left:8px; vertical-align:middle; }
    .hv-estado.en_produccion { background:#CFFAFE; color:#155E75; }
    .hv-estado.en_cola       { background:#DBEAFE; color:#1D4ED8; }
    .hv-estado.sin_cola      { background:#F1F5F9; color:#475569; }
    .hv-estado.finalizado    { background:#D1FAE5; color:#065F46; }
    .hv-estado.sin_aprobar   { background:#FEF3C7; color:#92400E; }

    /* Etapas del ciclo de vida: las dos últimas aún no existen como módulo */
    .hv-etapas { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
    .hv-etapa { flex:1; min-width:110px; border:1.5px solid var(--cf-gray-mid); border-radius:8px; padding:8px 10px; font-size:0.72rem; }
    .hv-etapa .t { font-weight:800; color:var(--cf-dark); }
    .hv-etapa .v { color:var(--cf-gray-text); margin-top:2px; }
    .hv-etapa.ok  { border-color:#16A34A; background:#F0FDF4; }
    .hv-etapa.act { border-color:#0891B2; background:#ECFEFF; }
    .hv-etapa.futuro { opacity:0.5; border-style:dashed; }

    .hv-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
    .hv-card { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px; border-left:4px solid var(--cf-blue); }
    .hv-card .label { font-size:0.7rem; font-weight:700; color:var(--cf-gray-text); text-transform:uppercase; letter-spacing:0.04em; }
    .hv-card .value { font-size:1.35rem; font-weight:800; color:var(--cf-dark); line-height:1.2; }
    .hv-card .sub { font-size:0.7rem; color:var(--cf-gray-text); }

    .hv-sec { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:14px; }
    .hv-sec h3 { font-size:0.82rem; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; color:var(--cf-dark); margin:0 0 12px; }
    .hv-cot { border:1px solid var(--cf-gray-mid); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
    .hv-cot-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .hv-cot-nom { font-weight:700; font-size:0.88rem; color:var(--cf-dark); }
    .hv-cot-meta { font-size:0.74rem; color:var(--cf-gray-text); margin-top:2px; }
    .hv-nota { font-size:0.74rem; color:#7C3AED; font-style:italic; margin-top:3px; }
    .hv-uni { display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--cf-gray); border-radius:6px; margin-top:5px; font-size:0.75rem; flex-wrap:wrap; }
    .hv-uni .n { font-weight:700; color:var(--cf-dark); }
    .hv-uni .f { color:var(--cf-gray-text); }
    .hv-uni .badge { font-size:0.63rem; font-weight:800; padding:1px 7px; border-radius:999px; }
    .badge.cola { background:#DBEAFE; color:#1D4ED8; }
    .badge.prod { background:#CFFAFE; color:#155E75; }
    .badge.back { background:#F1F5F9; color:#475569; }
    .badge.fin  { background:#D1FAE5; color:#065F46; }
    .badge.atr  { background:#DC2626; color:#fff; }
    .pill-aprob { font-size:0.63rem; font-weight:800; padding:1px 7px; border-radius:999px; background:#D1FAE5; color:#065F46; }
    .pill-noaprob { font-size:0.63rem; font-weight:800; padding:1px 7px; border-radius:999px; background:#F1F5F9; color:#64748B; }
  </style>
</head>
<body>

  <header class="app-header">
    <img src="assets/logo-horizontal-blanco.svg"
         onerror="this.outerHTML='<span style=\'color:#fff;font-weight:800;font-size:1.1rem\'><span>COL</span><span style=\'color:#0072CE\'>FRAME</span></span>'"
         alt="COLFRAME" class="header-logo">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="color:rgba(255,255,255,0.65);font-size:0.78rem;font-weight:600;letter-spacing:0.05em;">HOJA DE VIDA</span>
      <button id="logoutBtn" class="btn-icon" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <nav id="modNav" class="mod-nav hidden">
    <a href="cotizaciones.html" class="mod-nav-link">Cotizaciones</a>
    <a href="programacion.html" class="mod-nav-link">Programación</a>
    <a href="produccion.html"   class="mod-nav-link">Producción</a>
    <span class="mod-nav-sep" aria-hidden="true"></span>
    <a href="admin.html"        class="mod-nav-link">Asistencia</a>
  </nav>

  <div class="admin-main admin-panel">
    <div id="hvBody">
      <div style="text-align:center;padding:56px 24px;color:var(--cf-gray-text);">
        <span class="spinner" style="border-color:rgba(0,0,0,0.1);border-top-color:var(--cf-blue);"></span>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed;top:80px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/proyecto.js"></script>
</body>
</html>
